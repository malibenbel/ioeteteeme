<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Per la mia principessina 🌷</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- HERO -->

<section id="hero">

    <div class="hero-content">

        <h1>
            Buon compleanno<br>
            principessina ❤️
        </h1>

        <p>
            C'è una piccola cosa che volevo regalarti
        </p>

        <button id="giftButton">
            🌷 Apri il regalino
        </button>

    </div>

</section>

<!-- BOUQUET -->

<section id="bouquet" class="hidden">

    <img
        src="assets/tulips.png"
        alt="Tulipani"
        class="bouquet-image">

    <div class="bouquet-text">

        <h2>

            Se potessi regalarti
            tutti i tulipani del mondo,
            lo farei.

        </h2>

        <p>

            Per ora ho iniziato da questi ❤️

        </p>

    </div>

</section>

<!-- FOTO -->

<section class="photo">

    <img src="assets/photo1.jpg" alt="">

</section>

<section class="photo">

    <img src="assets/photo2.jpg" alt="">

</section>

<section class="photo">

    <img src="assets/photo3.jpg" alt="">

</section>

<section class="photo">

    <img src="assets/photo4.jpg" alt="">

</section>

<!-- TRANSITION -->

<section id="transition">

    <div class="transition-content">

        <p class="line1">

            In mezzo a tutta quella gente...

        </p>

        <p class="line2">

            ...io vedevo solo te.

        </p>

        <button id="videoButton">

            ❤️ Un ultimo ricordo

        </button>

    </div>

</section>

<!-- VIDEO -->

<section id="videoSection" class="hidden">

    <video
        id="memoryVideo"
        controls
        playsinline
        preload="metadata">

        <source
            src="assets/memory-2.mp4"
            type="video/mp4">

    </video>

</section>

<!-- ENDING -->

<section id="ending" class="hidden">

    <div class="ending-content">

        <h2>

            Buon compleanno<br>
            cuore mio.

        </h2>

        <p>

            Ti amo infinito +4 🧩

        </p>

    </div>

</section>

<script src="script.js"></script>

</body>

</html>
